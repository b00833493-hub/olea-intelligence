name: Refresh data

# Re-fetch news + FX + FDI, commit & push si changement.
# GitHub Pages redéploie automatiquement après chaque push.

on:
  schedule:
    # Toutes les heures à HH:15 UTC. Décalé pour éviter les pics top-of-the-hour.
    - cron: '15 * * * *'
  workflow_dispatch: {}   # bouton "Run workflow" dans l'UI GitHub

# Évite que deux runs concurrents tentent de push en même temps
concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write     # nécessaire pour push le commit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Token GITHUB_TOKEN par défaut suffit pour push sur le même repo
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch news (regulatory veille incluse)
        run: python3 fetch_news.py

      - name: Fetch FX (taux EUR → devises locales OLEA)
        run: python3 fetch_fx.py || echo "::warning::fetch_fx a échoué"

      - name: Fetch FDI (Investissements directs étrangers, World Bank)
        run: python3 fetch_fdi.py || echo "::warning::fetch_fdi a échoué"

      - name: Commit if changed
        run: |
          git config user.name  "OLEA Intelligence Bot"
          git config user.email "olea-intel-bot@users.noreply.github.com"

          git add news.json fx.json fdi.json
          if git diff --cached --quiet; then
            echo "→ Aucun changement, rien à committer."
            exit 0
          fi

          # Compteurs pour le message de commit
          n_signals=$(python3 -c "import json; print(json.load(open('news.json'))['stats']['total_signals'])")
          n_verified=$(python3 -c "import json; print(json.load(open('news.json'))['stats']['verified_signals'])")
          fx_count=$(python3 -c "import json; print(len(json.load(open('fx.json'))['rates']))" 2>/dev/null || echo "?")
          fdi_count=$(python3 -c "import json; d=json.load(open('fdi.json')); print(d['coverage_count'])" 2>/dev/null || echo "?")

          git commit -m "chore(data): refresh — ${n_signals} signaux (${n_verified} vérif.) · ${fx_count} taux FX · ${fdi_count} pays IDE"
          git push
          echo "→ ✓ news.json + fx.json + fdi.json poussés."

      - name: Upload artifact (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-news-json
          path: news.json
          retention-days: 3
